# Valida los repositorios y el README del portfolio

name: Portfolio Health Check

on:
  schedule:
    - cron: '0 9 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-repos:
    name: Verificar repos del portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Verificar que los repos existen y tienen README
        run: |
          USUARIO="${{ github.repository_owner }}"
          REPOS=(
            "devops-TP01"
            "devops-TP02"
            "devops-TP03"
            "devops-TP04"
            "devops-TP05"
            "devops-TP06"
            "devops-TP08"
            "devops-TP09"
            "devops-TP10"
            "devops-TP11"
          )

          ERRORES=0
          echo "### Estado del portfolio" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo | Estado | Último commit |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for REPO in "${REPOS[@]}"; do
            URL="https://api.github.com/repos/$USUARIO/$REPO"
            DATOS=$(curl -fsS "$URL" 2>/dev/null || echo "")

            if [ -z "$DATOS" ]; then
              echo "[FAIL] $REPO no encontrado"
              echo "| $REPO | no encontrado | — |" >> "$GITHUB_STEP_SUMMARY"
              ERRORES=$((ERRORES+1))
              continue
            fi

            RAMA=$(echo "$DATOS" | jq -r '.default_branch // empty')

            README_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.github.com/repos/$USUARIO/$REPO/contents/README.md?ref=$RAMA")

            if [ "$README_CODE" != "200" ]; then
              echo "[FAIL] $REPO no tiene README.md"
              echo "| $REPO | sin README | — |" >> "$GITHUB_STEP_SUMMARY"
              ERRORES=$((ERRORES+1))
              continue
            fi

            LAST=$(curl -fsS \
              "https://api.github.com/repos/$USUARIO/$REPO/commits?sha=$RAMA&per_page=1" \
              | jq -r '.[0].commit.committer.date // "?"' | cut -dT -f1)

            echo "[OK] $REPO (README correcto, último commit: $LAST)"
            echo "| $REPO | activo | $LAST |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "Total repos verificados: ${#REPOS[@]}"
          echo "Errores: $ERRORES"
          [ "$ERRORES" -eq 0 ] && exit 0 || exit 1

  lint-readme:
    name: Lint del README principal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que el README tiene todas las secciones
        run: |
          SECCIONES=(
            "Stack tecnológico"
            "Proyectos por TP"
            "Proyecto integrador"
            "Cómo ver cada proyecto"
            "Plataformas usadas"
          )

          FALTANTES=0
          for SEC in "${SECCIONES[@]}"; do
            if grep -q "$SEC" README.md; then
              echo "[OK] Sección: $SEC"
            else
              echo "[FAIL] Falta sección: $SEC"
              FALTANTES=$((FALTANTES+1))
            fi
          done

          [ "$FALTANTES" -eq 0 ] && echo "README completo" || exit 1

  generate-summary:
    name: Generar resumen del portfolio
    runs-on: ubuntu-latest
    needs: [check-repos, lint-readme]
    steps:
      - uses: actions/checkout@v4

      - name: Generar stats del portfolio
        run: |
          echo "## Portfolio Stats — $(date '+%Y-%m-%d')"
          echo ""
          echo "- TPs completados: 12 / 12"
          echo "- Tecnologías cubiertas: $(grep -c '^|' README.md) líneas de tabla"
          echo "- Repositorios de TPs: 10"
          echo "- Repositorio principal: devops-portfolio"
          echo "- Inversión total: \$0"
          echo ""
          echo "Pipeline corrido exitosamente"
